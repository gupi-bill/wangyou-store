<script>
/* 早起的看门狗：出错要让人看见，别留一片白 */
window.__mzErr = function (msg) {
  try {
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#3a1520;' +
      'border:1px solid #e88ba0;color:#f2ece1;padding:10px 14px;border-radius:10px;' +
      'font:12px/1.5 ui-monospace,monospace;box-shadow:0 8px 30px rgba(0,0,0,.5);white-space:pre-wrap';
    b.textContent = '⚠ ' + msg;
    document.body.appendChild(b);
  } catch (e) {}
};
window.addEventListener('error', function (e) {
  if (e && e.message && /ResizeObserver/.test(e.message)) return;
  window.__mzErr((e.message || 'unknown') + '\n  ' + ((e.filename || '').split('/').pop() + ':' + (e.lineno || '?')));
});
</script>
